name: Reparar edición

# Corrige a mano el texto de una edición ya publicada, sin volver a correr el
# pipeline ni gastar API: baja el archivo de R2, aplica el parche
# config/reparaciones/<fecha>.json (scripts/repair_edition.py), valida, regenera
# feeds y búsqueda, sube el archivo a R2 y publica el sitio. Solo a mano.

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de la edición (AAAA-MM-DD); usa config/reparaciones/<fecha>.json'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Comparte cola con "Publicar sitio" para no pisar un despliegue.
  group: deploy-site
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FECHA: ${{ inputs.fecha }}
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la fecha y el parche
        run: |
          set -euo pipefail
          [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Fecha inválida: $FECHA"; exit 1; }
          test -f "config/reparaciones/$FECHA.json" || { echo "::error::No existe config/reparaciones/$FECHA.json"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Traer el archivo de ediciones (R2)
        # Sin el archivo completo no se repara: subir solo una parte borraría ediciones.
        run: python3 scripts/archive_r2.py pull web/data

      - name: Aplicar el parche
        run: python3 scripts/repair_edition.py "config/reparaciones/$FECHA.json" --web-dir ./web

      - name: Validar la edición
        run: python3 scripts/validate_report.py --web-dir ./web --date "$FECHA"

      - name: Guardar el archivo en R2
        run: python3 scripts/archive_r2.py push web/data

      - name: Publicar el sitio en Cloudflare Pages
        run: bash scripts/deploy_site.sh
