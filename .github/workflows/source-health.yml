name: Salud de las fuentes

# Revisa todos los días que cada fuente responda (RSS, arXiv, Mastodon, Bluesky y
# reguladores). No usa la API de Anthropic ni de Google: costo cero. Si una fuente
# falla dos revisiones seguidas, la corrida termina en rojo y GitHub manda correo;
# el detalle queda en el resumen de la corrida. Con Issues activados en el repo,
# además abre un issue "salud-fuentes" y lo cierra cuando todas se recuperan.

on:
  schedule:
    - cron: "17 13 * * *"   # 07:17 en Ciudad de México (UTC-6, sin horario de verano)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias mínimas
        run: pip install feedparser requests

      # El estado (fallas seguidas por fuente) viaja entre corridas en la caché.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: data/source_health.json
          key: source-health-${{ github.run_id }}
          restore-keys: source-health-

      - name: Revisar fuentes y avisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source_health_alert.py --state data/source_health.json

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/source_health.json
          key: source-health-${{ github.run_id }}
